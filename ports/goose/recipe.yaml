# Goose recipe: ashlr MCP router
#
# Requires `ashlr-mcp` on PATH:
#   npm install -g ashlr-plugin
#
# Usage:
#   goose run --recipe ports/goose/recipe.yaml
#
# One stdio extension registers the ashlr router with all 54 MCP tools.

version: "1.0"
title: ashlr token-efficiency suite
description: >
  Registers the ashlr MCP router as one Goose extension.
  Provides token-efficient Read/Grep/Edit/MultiEdit, SQL, Bash,
  Tree, HTTP, Diff, Logs, Genome, Orient, GitHub, Glob, WebFetch,
  Ask, savings, and orchestration tools.

extensions:
  - name: ashlr
    type: stdio
    cmd: ashlr-mcp
    args: []
    env:
      ASHLR_MCP_HOST: generic
