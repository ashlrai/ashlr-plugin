name: CodeQL

# No pull_request trigger. This repo has no merge queue, so push to main
# is what actually runs the scan between nightly cron and manual runs.
# Nightly at 07:38 UTC: minute 38 is the sum of the repo name, so this
# does not share ashlr-md's 06:17 slot.
on:
  # Daily only (Mason, Oct 28 2026): CodeQL is not a required check.
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  # Superseded PR runs cancel; merge_group entries and default-branch pushes
  # get a group per commit and are never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
