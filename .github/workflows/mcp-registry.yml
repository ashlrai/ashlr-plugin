name: MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Auth: GitHub OIDC, no stored secrets. The npm version named in server.json must
# already be published with a matching "mcpName", or the registry rejects it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: .
        run: $GITHUB_WORKSPACE/mcp-publisher publish
