name: ci
run-name: ci/${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope || 'full' }}

on:
  # PR and merge queue run only the seconds-fast gate (Mason, Oct 28 2026:
  # merge fast, test later, fix forward daily). Main pushes also run the fast
  # gate so auto-tag can verify the exact commit it will release.
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
  schedule:
    # Daily full suite at 06:00 ET (10:00 UTC): linux, macOS, Windows, bench.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full qualification or bounded Windows diagnosis (never release proof)
        type: choice
        required: true
        default: full
        options: [full, windows-diagnostics]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # fast: classify, version sync, and (for code changes) root install plus
  # typecheck. OS-sensitive pull requests also run the Windows and macOS
  # legs below. Those legs are not CI Gate needs. The full suites stay daily.
  # ---------------------------------------------------------------------------
  fast:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      os: ${{ steps.classify.outputs.os }}
    steps:
      - name: Validate closed validation scope
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.validation_scope }}
        run: |
          node <<'NODE'
          const scope = process.env.EVENT === 'workflow_dispatch' ? (process.env.SCOPE || 'full') : 'full';
          if (!['full', 'windows-diagnostics'].includes(scope)) throw new Error('unknown validation scope');
          NODE
      - name: Full qualification scope
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope == '' || inputs.validation_scope == 'full'
        run: echo 'Canonical full validation selected'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            files="$(git diff --name-only "$BASE...$HEAD")"
            printf '%s\n' "$files"
          fi
          # Docs-only skip is pull_request only. Every other event, merge_group
          # included, still runs the full fast checks.
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else
            if printf '%s\n' "$files" | grep -Ev '^(docs/|site/|video/|[^/]*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' | grep -q .; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            os="$(printf '%s\n' "$files" | node scripts/os-path-gate.mjs)"
            echo "os=$os" >> "$GITHUB_OUTPUT"
          else
            echo "os=true" >> "$GITHUB_OUTPUT"
          fi
      # setup-bun resolves `latest` over the network; a transient "fetch failed"
      # failed main push runs 41900907448 and 42568245722 (retry failed too).
      # Pin the version coverage.yml already uses so no release lookup is needed,
      # and keep one retry for the download itself.
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        continue-on-error: true
        with:
          bun-version: 1.4.4
      - name: Set up Bun (retry)
        if: steps.bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Version sync check
        run: bun run version:check
      # Restore and save are separate so a fork pull_request, whose token cannot
      # write the cache, never fails this job on the post-save step. A miss still
      # installs from the lockfile. Same-repo PRs, merge_group and push save.
      - name: Restore node_modules cache
        id: cache
        if: steps.classify.outputs.code == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-fast-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install root deps
        if: steps.classify.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - name: Save node_modules cache
        if: success() && steps.classify.outputs.code == 'true' && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-fast-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Typecheck
        if: steps.classify.outputs.code == 'true'
        run: bun run typecheck
      # Exact-tag full CI is the release proof. Auto-tag only sees this fast
      # job, so a version bump that forgets generated site facts must fail here
      # instead of occupying an immutable tag. The docs corpus stays excluded.
      - name: Site release facts
        if: steps.classify.outputs.code == 'true'
        run: bun run site/scripts/gen-docs.ts --check --skip-corpus

  # ---------------------------------------------------------------------------
  # linux: every Linux check in ONE job.
  #
  # The checks themselves take about two minutes, but each separate job waits
  # for an org-shared runner, and the old layout (classify -> 6 parallel jobs
  # -> integration -> gate) paid that queue four times in a row and used eight
  # runners per PR. One job pays it once. Every check step runs even when an
  # earlier one fails (`!cancelled()`), so one run reports every failure.
  # Docs/site/video-only PRs run only the version-sync step.
  # ---------------------------------------------------------------------------
  linux:
    name: linux checks
    # Daily and dispatch only.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.validation_scope == '' || inputs.validation_scope == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: classify
        name: Mark full run
        run: |
          set -euo pipefail
          echo "code=true" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Zero-dependency manifest drift check: runs for every change.
      - name: Version sync check
        run: bun run version:check
      - name: Cache node_modules
        if: steps.classify.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            server/node_modules
            site/node_modules
            vscode/node_modules
            integration/node_modules
          key: bun-linux-all-${{ hashFiles('bun.lock', 'server/bun.lock', 'site/bun.lock', 'vscode/bun.lock', 'integration/package.json') }}
      - name: Install ripgrep
        if: steps.classify.outputs.code == 'true'
        run: sudo apt-get install -y ripgrep
      - name: Install deps (root, server, site, vscode, integration)
        if: steps.classify.outputs.code == 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd server && bun install --frozen-lockfile)
          (cd site && bun install --frozen-lockfile)
          (cd vscode && bun install --frozen-lockfile)
          (cd integration && bun install --frozen-lockfile)
      - name: Assert registered MCP tool count
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: bun run smoke:tools
      - name: Typecheck
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: bun run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: bun run test
      - name: Upload unit test failure log
        if: ${{ failure() && steps.classify.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-failure-${{ runner.os }}
          path: test-results/unit-failure.log
          if-no-files-found: ignore
      - name: Real-time counters smoke test
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: bun run scripts/smoke-realtime.ts
        timeout-minutes: 2
      - name: Cross-platform smoke test
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: bun run scripts/smoke-cross-platform.ts
        timeout-minutes: 2
      - name: Check server
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: cd server && bun run check
      - name: Check site
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: cd site && bun run check
      - name: Check VS Code extension
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: cd vscode && bun run check
      - name: Benchmark dry-run
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: bun run scripts/run-benchmark.ts --repo . --dry-run
      # End-to-end: spawns the backend server and exercises the full request
      # path. The server is deployed on Linux, so Linux is the parity target.
      - name: Integration tests
        if: ${{ !cancelled() && steps.classify.outputs.code == 'true' }}
        run: cd integration && bun test --timeout 30000
        env:
          TESTING: "1"
          ASHLR_DISABLE_CLOUD_LLM: "1"

  # ---------------------------------------------------------------------------
  # other-os: typecheck, unit tests and smoke on macOS and Windows, one job per
  # OS. Runs on the daily schedule and workflow_dispatch.
  # ---------------------------------------------------------------------------
  other-os:
    name: checks (${{ matrix.os }})
    needs: linux
    if: needs.linux.outputs.code == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Disable CRLF auto-conversion (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          # Include OS in cache key so Windows/mac don't share native modules.
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey is always preinstalled on windows-latest and doesn't
        # need the msstore source agreement that breaks `winget install` in
        # CI (see https://github.com/microsoft/winget-cli/issues/4403).
        run: choco install ripgrep -y --no-progress
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: bun run test
      - name: Upload unit test failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-failure-${{ runner.os }}
          path: test-results/unit-failure.log
          if-no-files-found: ignore
      - name: Assert registered MCP tool count
        if: ${{ !cancelled() }}
        run: bun run smoke:tools
      - name: Real-time counters smoke test
        if: ${{ !cancelled() }}
        # smoke-realtime.ts uses process.env.HOME; on Windows HOME is unset by
        # default — Bun sets it from USERPROFILE, which is fine.
        run: bun run scripts/smoke-realtime.ts
        timeout-minutes: 2
      - name: Cross-platform smoke test
        if: ${{ !cancelled() }}
        run: bun run scripts/smoke-cross-platform.ts
        timeout-minutes: 2

  # ---------------------------------------------------------------------------
  # benchmark: daily full run, uploads updated JSON, opens a PR for review.
  # ---------------------------------------------------------------------------
  benchmark:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - name: Run benchmark
        run: bun run scripts/run-benchmark.ts --repo . --out docs/benchmarks-self.json
      - name: Upload benchmark data
        # Always keep the numbers, even when the repo setting below forbids the
        # PR step: download this artifact and commit docs/benchmarks-self.json.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-self
          path: docs/benchmarks-self.json
          if-no-files-found: error
      - name: Open PR with updated benchmark data
        id: open_pr
        # "GitHub Actions is not permitted to create or approve pull requests"
        # (run 39195707592) is a repository setting, not a benchmark failure.
        # Do not fail main for it; the next step says what to do instead.
        continue-on-error: true
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly benchmark refresh"
          branch: chore/weekly-benchmark-refresh
          title: "chore: weekly benchmark refresh"
          body: |
            Automated weekly benchmark run.

            Re-run locally with:
            ```
            bun run scripts/run-benchmark.ts --repo . --out docs/benchmarks-self.json
            ```

            Review the aggregate numbers in `docs/benchmarks-self.json` before merging.
          add-paths: docs/benchmarks-self.json
      - name: Explain a skipped benchmark PR
        if: steps.open_pr.outcome == 'failure'
        run: |
          echo "::warning title=Benchmark PR not opened::Actions could not open the weekly benchmark PR (usually: Settings > Actions > General > Allow GitHub Actions to create and approve pull requests is off). The data is in the benchmarks-self artifact of this run; commit docs/benchmarks-self.json from it. The numbers come from calling the plugin handlers on this repository's own files, so read them as a regression signal for this repo, not a general claim."

  # ---------------------------------------------------------------------------
  # integration-windows: narrow smoke coverage proving the MCP entrypoint boots
  # and answers canonical tool calls on Windows. This is a PREREQUISITE for
  # trusting v1.15+ Windows path-handling fixes in the wild.
  #
  # Intentionally narrow (3 tool calls) to keep runtime bounded and avoid
  # flakiness from OS-specific integration test fixtures. Every selected role
  # is mandatory: diagnostic failures must remain failures in the CI gate.
  # ---------------------------------------------------------------------------
  integration-windows:
    needs: linux
    if: ${{ always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'windows-diagnostics') || (needs.linux.result == 'success' && needs.linux.outputs.code == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.validation_scope == '' || inputs.validation_scope == 'full'))))) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable CRLF auto-conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Bounded Windows diagnostics (not release qualification)
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'windows-diagnostics'
        env:
          TESTING: "1"
          ASHLR_DISABLE_CLOUD_LLM: "1"
        run: bun scripts/windows-release-diagnostics.ts
      - name: MCP server smoke — spawn efficiency-server and issue canonical tool calls
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope == '' || inputs.validation_scope == 'full'
        shell: pwsh
        timeout-minutes: 3
        env:
          TESTING: "1"
          ASHLR_DISABLE_CLOUD_LLM: "1"
        # Feeds an initialize + 3 tools/call requests (ashlr__read, ashlr__grep,
        # ashlr__savings) into the stdio MCP entrypoint. We assert that each
        # request gets a non-error JSON-RPC response (result.content present).
        # This is intentionally inline — the purpose is to prove the server
        # boots and answers on Windows, not to replace the Linux integration
        # suite.
        run: |
          $ErrorActionPreference = "Stop"
          $req1 = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"win-smoke","version":"1"}}}'
          $req2 = '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"ashlr__read","arguments":{"path":"package.json"}}}'
          $req3 = '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"ashlr__grep","arguments":{"pattern":"name","path":"package.json"}}}'
          $req4 = '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"ashlr__savings","arguments":{}}}'
          $payload = "$req1`n$req2`n$req3`n$req4`n"
          $out = $payload | bun run scripts/mcp-entrypoint.ts servers/efficiency-server.ts 2>$null
          Write-Host "---- server stdout ----"
          Write-Host $out
          Write-Host "---- end stdout ----"
          $saw = @{ "2" = $false; "3" = $false; "4" = $false }
          foreach ($line in ($out -split "`n")) {
            $t = $line.Trim()
            if (-not $t) { continue }
            try { $msg = $t | ConvertFrom-Json } catch { continue }
            if ($null -ne $msg.id -and $saw.ContainsKey([string]$msg.id)) {
              if ($msg.error) {
                throw "tool call id=$($msg.id) returned error: $($msg.error | ConvertTo-Json -Compress)"
              }
              if ($msg.result) { $saw[[string]$msg.id] = $true }
            }
          }
          foreach ($id in @("2","3","4")) {
            if (-not $saw[$id]) { throw "Missing successful response for id=$id" }
          }
          Write-Host "OK: all 3 canonical tool calls responded successfully"

  secret-shape:
    # Security floor: pinned scrub.pl (sha256 5aa902ab) over the added lines of
    # the candidate diff, on every event. No if and no paths filter; the gate
    # fails closed unless this job succeeds.
    name: Secret-shape scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A fork pull_request head is advertised as refs/pull/N/head on this
          # repository. A raw head SHA is not always advertised to a read-only
          # token, and a failed fetch would fail the scan before it judged the diff.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          persist-credentials: false
      - name: Scan candidate diff (fail closed)
        env:
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          if [ -z "${BASE_SHA}" ]; then BASE_SHA="$(git rev-parse "${HEAD_SHA}^1")"; fi
          base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          git diff --no-color --no-ext-diff "${base}" "${HEAD_SHA}" > "${RUNNER_TEMP}/candidate.diff"
          perl .github/tests/secret-shape/scrub.pl --check --allow-fixtures < "${RUNNER_TEMP}/candidate.diff"
  # Single required status check. Fails on any failed/cancelled job, or if a
  # job that should have run for this event did not succeed.
  gate:
    name: CI Gate
    if: always()
    needs: [fast, secret-shape, linux, other-os, benchmark, integration-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.validation_scope }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const keys = ['fast', 'secret-shape', 'linux', 'other-os', 'benchmark', 'integration-windows'];
          if (JSON.stringify(Object.keys(needs).sort()) !== JSON.stringify([...keys].sort())) throw new Error('gate inventory drift');
          for (const job of ['fast', 'secret-shape']) {
            if (needs[job]?.result !== 'success') throw new Error(`${job}: ${needs[job]?.result}`);
          }
          const scope = process.env.EVENT === 'workflow_dispatch' ? (process.env.SCOPE || 'full') : 'full';
          if (!['full', 'windows-diagnostics'].includes(scope)) throw new Error('unknown validation scope');
          const diagnostic = process.env.EVENT === 'workflow_dispatch' && scope === 'windows-diagnostics';
          const full = !diagnostic && (process.env.EVENT === 'schedule' || process.env.EVENT === 'workflow_dispatch');
          const expect = {
            linux: full,
            'other-os': full,
            'integration-windows': full || diagnostic,
            benchmark: process.env.EVENT === 'schedule',
          };
          const bad = [];
          for (const [job, selected] of Object.entries(expect)) {
            const result = needs[job]?.result;
            if (selected ? result !== 'success' : result !== 'skipped') bad.push(`${job}=${result} (selected=${selected})`);
          }
          if (bad.length) throw new Error(bad.join(', '));
          console.log(`CI Gate passed (${process.env.EVENT}, scope=${scope}, releaseEligible=${full})`);
          NODE

  fixup-queue:
    # Daily red run -> READY FIXUP lines for the router queue (fix-forward owner:
    # ci-efficiency). One line per failed job from the needs context only: no
    # logs or env, read-only token, passed through the pinned scrub.pl.
    name: Daily fixup queue
    needs: [fast, linux, other-os, benchmark, integration-windows, secret-shape, gate]
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.validation_scope == '' || inputs.validation_scope == 'full'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout scrubber
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/tests/secret-shape/scrub.pl
          sparse-checkout-cone-mode: false
      - name: Build fixup-queue.txt
        env:
          NEEDS: ${{ toJSON(needs) }}
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          sha7="${GITHUB_SHA:0:7}"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s' "$NEEDS" | jq -r --arg sha7 "$sha7" --arg run "$run" --arg repo "ashlr-plugin" --arg up "$(echo ashlr-plugin | tr a-z- A-Z-)" '
            [to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | to_entries[] |
            "- READY RQ-FIXUP-\($up)-\($sha7)-\(.key + 1) (P0, pool=any, repo=\($repo), lead=CI-Efficiency, owner=ci-efficiency, job=\(.value.key), result=\(.value.value.result), run=\($run), sha=\($sha7)): daily full suite job \(.value.key) concluded \(.value.value.result); first error is in the run'"'"'s failed step."' > raw.txt
          perl .github/tests/secret-shape/scrub.pl < raw.txt > fixup-queue.txt
          echo "fixup_lines=$(wc -l < fixup-queue.txt)"
          cat fixup-queue.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fixup queue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ashlr-plugin-fixup-queue
          path: fixup-queue.txt
          if-no-files-found: error
          retention-days: 7

  # Pull-request and merge-queue Windows and macOS legs. The daily
  # checks (matrix.os) and integration-windows jobs stay on the schedule,
  # so CI Gate's needs are unchanged and those runners do not sit in front
  # of CI Gate. These jobs call the same root test runner.
  os-fast-windows:
    name: affected checks (windows-latest)
    needs: [fast]
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.fast.result == 'success' && needs.fast.outputs.os == 'true' }}
    runs-on: windows-latest
    # Same budget as checks (windows-latest). Green Unit tests p95 was 210s
    # on runs 45272910123, 45049531204, 44151639075, 43736685430, 43068692726, 42863882254.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress
      - name: Restore node_modules cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Save node_modules cache
        if: success() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Typecheck
        run: bun run typecheck
      - name: Affected tests
        if: success()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bun scripts/os-affected-tests.ts "$BASE_SHA"
      - name: Upload unit test failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-failure-${{ runner.os }}
          path: test-results/unit-failure.log
          if-no-files-found: ignore

  os-fast-macos:
    name: affected checks (macos-latest)
    needs: [fast]
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.fast.result == 'success' && needs.fast.outputs.os == 'true' }}
    runs-on: macos-latest
    # Green macOS Unit tests p95 was 116s on the same six daily runs. 20 minutes matches the existing macOS job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Restore node_modules cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Save node_modules cache
        if: success() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Typecheck
        run: bun run typecheck
      - name: Affected tests
        if: success()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bun scripts/os-affected-tests.ts "$BASE_SHA"
      - name: Upload unit test failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-failure-${{ runner.os }}
          path: test-results/unit-failure.log
          if-no-files-found: ignore

  install-smoke-linux:
    name: install smoke (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Same 10 minute budget as integration-windows. A cold npm install is smaller than that job's ripgrep plus smoke.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install this commit
        run: bun scripts/install-smoke.ts commit
      - name: Install published release
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: bun scripts/install-smoke.ts release

  install-smoke-windows:
    name: install smoke (windows)
    needs: [fast]
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.fast.result == 'success' && needs.fast.outputs.os == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install this commit
        run: bun scripts/install-smoke.ts commit
      - name: Install published release
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: bun scripts/install-smoke.ts release

  install-smoke-macos:
    name: install smoke (macos)
    needs: [fast]
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.fast.result == 'success' && needs.fast.outputs.os == 'true')) }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install this commit
        run: bun scripts/install-smoke.ts commit
      - name: Install published release
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: bun scripts/install-smoke.ts release

  gate-linux:
    name: Gate (linux)
    if: always()
    needs: [fast, linux, install-smoke-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/os-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Require linux jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/os-gate.mjs

  gate-windows:
    name: Gate (windows)
    if: always()
    needs: [os-fast-windows, integration-windows, install-smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/os-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Require windows jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/os-gate.mjs

  gate-macos:
    name: Gate (macos)
    if: always()
    needs: [os-fast-macos, install-smoke-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/os-gate.mjs
          sparse-checkout-cone-mode: false
      - name: Require macOS jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/os-gate.mjs
