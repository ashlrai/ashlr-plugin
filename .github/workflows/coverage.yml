name: Coverage

# No pull_request trigger. This repo has no merge queue, so push to main
# is what collects coverage. ci.yml itself is unchanged.
on:
  merge_group:
  push:
    branches: [main]

# A burst of pushes to main cancels the older run. Each run covers the whole suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # ci.yml asks for "latest". The last green main run resolved that
          # to 1.4.4 (run 40257855078). Pin the resolved version.
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Unit tests with coverage
        env:
          ASHLR_STATS_SYNC: "1"
        run: |
          set -euo pipefail
          # scripts/run-root-tests.ts drops extra flags, so call bun test
          # directly. Same files as that wrapper (__tests__), but one process:
          # --parallel=4 is the pulse-emit flake in #138. Coverage needs more
          # than the wrapper's 10000ms CI budget, so the per-test timeout is
          # 20000ms.
          bun test --timeout=20000 --coverage --coverage-reporter=lcov --coverage-dir=coverage __tests__
          if [ ! -s coverage/lcov.info ]; then
            echo "coverage/lcov.info is missing"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 5

  upload:
    name: Upload coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info
