name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: latest
      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - name: Check version manifests match tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "ERROR: package.json version ($MANIFEST_VERSION) != tag ($VERSION)."
            echo "Run: bun run scripts/bump-version.ts $VERSION  (then commit before tagging)"
            exit 1
          fi
          bun run version:check
      - run: bun run typecheck
      # Tests are not re-run here: the tagged commit already passed CI Gate on main.
      - name: Extract CHANGELOG notes for this version
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Extract the section between this version header and the next
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > /tmp/release-notes.md
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # VS Code extension artifact
      # Requires @vscode/vsce to be installed. If vsce is absent (fresh runner),
      # we skip packaging gracefully rather than failing the whole release.
      # The .vsix is attached to the GitHub release as a downloadable asset.
      # -----------------------------------------------------------------------
      - name: Cache vscode node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vscode/node_modules
          key: bun-vscode-${{ runner.os }}-${{ hashFiles('vscode/bun.lock') }}
      - name: Install VS Code extension deps
        run: cd vscode && bun install --frozen-lockfile
      - name: Build VS Code extension
        run: cd vscode && bun run build
      - name: Package VS Code extension (.vsix)
        id: vsix
        shell: bash
        run: |
          cd vscode
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # vsce may not be installed globally; try npx as fallback.
          if command -v vsce &>/dev/null; then
            vsce package --out "out/ashlr-${VERSION}.vsix"
          elif npx --yes @vscode/vsce package --out "out/ashlr-${VERSION}.vsix" 2>/dev/null; then
            echo "packaged via npx"
          else
            echo "vsce unavailable — skipping .vsix packaging"
            echo "vsix_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "vsix_path=vscode/out/ashlr-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release (no-op if already exists)
        id: gh_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping creation."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Upload .vsix to release
        if: steps.vsix.outputs.vsix_path != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" "${{ steps.vsix.outputs.vsix_path }}" --clobber

  # npm publish through trusted publishing (OIDC): no NPM_TOKEN. Only on a
  # v*.*.* tag push (this workflow has no other trigger), after the release
  # job has checked the tag against package.json and typechecked.
  # Register on npmjs.com: owner ashlrai, repo ashlr-plugin, workflow
  # release.yml, no environment.
  npm-publish:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Upgrade npm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          npm --version
          if [ -n "${NPM_TOKEN:-}" ]; then echo "::error::token-based npm auth must not be configured"; exit 1; fi
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match ${name}@${version}" >&2; exit 1; }
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
