name: Deploy site to Vercel

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  # Cancel superseded PR previews only; main deploys queue and always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build + Deploy (Vercel)
    timeout-minutes: 20
    env:
      # Boolean only; the token itself is scoped to the deploy steps below so
      # PR install/build steps never see it.
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-site-${{ runner.os }}-

      - name: Setup Node (for vercel CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: env.HAS_VERCEL == 'true'
        # Unpinned: vercel@54.7.0 briefly broke `vercel build` (@vercel/build-utils
        # CJS/ESM regression — "Named export 'isPackageInstalled' not found");
        # fixed in 54.7.1, so we're back on @latest.
        run: npm install --global vercel@latest

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        working-directory: site
        run: bun run build

      # Production deploy — push to main OR manual workflow_dispatch + secret present.
      # Repos using Vercel's GitHub App can leave secrets unset; this workflow
      # then becomes a build-only check.
      #
      # Run from repo root, NOT from site/. The Vercel project's Root Directory
      # is set to "site"; if the CLI also runs in site/, it resolves the root
      # to site/site and fails with "path does not exist".
      - name: Validate Vercel secrets
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.HAS_VERCEL == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret is required when VERCEL_TOKEN is set."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret is required when VERCEL_TOKEN is set."; exit 1; }

      - name: Deploy to Vercel (production)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.HAS_VERCEL == 'true'
        env:
          CI: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          timeout 300s vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          timeout 600s vercel build --prod --token="$VERCEL_TOKEN"
          timeout 300s vercel deploy --prebuilt --prod --yes --no-wait --token="$VERCEL_TOKEN"

      # Preview deploy — PRs + secret present.
      - name: Deploy to Vercel (preview)
        if: github.event_name == 'pull_request' && env.HAS_VERCEL == 'true'
        env:
          CI: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret is required when VERCEL_TOKEN is set."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret is required when VERCEL_TOKEN is set."; exit 1; }
          timeout 300s vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          timeout 600s vercel build --token="$VERCEL_TOKEN"
          timeout 300s vercel deploy --prebuilt --yes --no-wait --token="$VERCEL_TOKEN"
