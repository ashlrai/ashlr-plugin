# SonarQube Cloud Automatic Analysis. No workflow and no token.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
sonar.organization=ashlrai
sonar.projectKey=ashlrai_ashlr-plugin

# Directories only. Automatic analysis does not accept wildcard patterns.
sonar.sources=hooks,ports,scripts,servers,examples,observability,eval/leaderboard,integration/lib,server/src,site,vscode/src,vscode/webview,video/src
sonar.tests=__tests__,server/tests,integration/tests
sonar.test.exclusions=__tests__/fixtures

# Vendored benchmark trees, generated output, dist, and fixtures.
sonar.exclusions=bench/refs,bench/fixtures,__tests__/fixtures,video/src/fixtures,video/out,vscode/out,dist,site/tsconfig.tsbuildinfo
